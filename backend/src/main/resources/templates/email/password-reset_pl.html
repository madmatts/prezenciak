<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{email/layout :: email(lang='pl', preheader='Link działa przez 1 godzinę.',
        heading='Ustaw nowe hasło', content=~{::content}, actionLabel='Ustaw nowe hasło', why=~{::why},
        footerNote='Wiadomość wysłana automatycznie — nie odpowiadaj na nią.')}">
<body>
<th:block th:fragment="content">
  <p style="margin:0 0 16px;font-family:'Plus Jakarta Sans',Arial,Helvetica,sans-serif;font-size:16px;line-height:24px;color:#1E1A17">Otrzymaliśmy prośbę o zmianę hasła do konta <span th:text="${appName}">Wishka</span>. Kliknij przycisk, żeby ustawić nowe hasło.</p>
  <p style="margin:0 0 16px;font-family:'Plus Jakarta Sans',Arial,Helvetica,sans-serif;font-size:16px;line-height:24px;color:#1E1A17">Link działa 1 godzinę i można go użyć tylko raz.</p>
</th:block>
<th:block th:fragment="why"><strong style="color:#48413B">Dlaczego dostajesz tę wiadomość?</strong> Ktoś poprosił o zmianę hasła dla tego adresu. Jeśli to nie Ty, zignoruj tę wiadomość — Twoje hasło się nie zmieni.</th:block>
</body>
</html>
