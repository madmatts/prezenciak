# Wishka - backend texts (English). Every key must also exist in messages_pl.properties.
# Named parameters: {name}. {appName} is always available (never write the brand name directly).

ping.message=Hi! {appName} is running.

error.BAD_REQUEST=The request is invalid.
error.VALIDATION_FAILED=Some fields are not filled in correctly.
error.UNAUTHORIZED=Please log in to continue.
error.FORBIDDEN=You don't have access to this resource.
error.CSRF_INVALID=Your session expired or the request is invalid. Refresh the page and try again.
error.NOT_FOUND=Not found.
error.METHOD_NOT_ALLOWED=This operation is not allowed.
error.CONFLICT=The data was changed in the meantime. Refresh and try again.
error.UNSUPPORTED_MEDIA_TYPE=Unsupported data format.
error.TOO_MANY_REQUESTS=Too many attempts. Please try again in a moment.
error.INTERNAL=Something went wrong on our side. Please try again later.
error.EMAIL_TAKEN=An account with this email address already exists.
error.INVALID_CREDENTIALS=Incorrect email or password.
error.TOKEN_INVALID_OR_EXPIRED=This link has expired or has already been used.
error.EMAIL_NOT_VERIFIED=Please confirm your email address first.
error.CURRENT_PASSWORD_INVALID=Your current password is incorrect.
error.LAST_LOGIN_METHOD=This is the only way to log in to your account, so it can't be removed.
error.PROVIDER_ALREADY_LINKED=This Google account is already connected to another account.

# Emails: subjects. Bodies live in templates/email/*_en.html and templates/email-text/*_en.txt.
email.ACCOUNT_VERIFY_EMAIL.subject={appName}: confirm your email address
email.ACCOUNT_PASSWORD_RESET.subject={appName}: set a new password
