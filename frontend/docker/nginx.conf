# Serves the built SPA. TLS, /api proxying and security headers live in the edge nginx (deploy/, Phase 8).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed assets never change: cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html and other routes: always revalidate, so a deploy is picked up immediately.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
